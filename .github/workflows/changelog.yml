name: Update application changelog

on:
  push:
    branches: [main]
    paths-ignore:
      - 'CHANGELOG.md'
      - 'data/**'
      - 'data.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: application-changelog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate and publish changelog
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/update_changelog.py
            git add CHANGELOG.md
            if git diff --cached --quiet; then
              echo 'Changelog already current'
              exit 0
            fi
            git commit -m 'docs: update automated changelog'
            if git push origin HEAD:main; then
              echo "Published changelog on attempt $attempt"
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'Unable to publish changelog after three attempts'
          exit 1
