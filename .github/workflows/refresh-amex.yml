name: Refresh Amex dataset (twice weekly)

on:
  schedule:
    - cron: '0 18 * * 1,4'   # 07:00 NZDT Tuesday and Friday
  workflow_dispatch:
    inputs:
      geocode_max:
        description: 'Max new addresses to geocode this run (~1-4 s each)'
        default: '1000'

permissions:
  contents: write

concurrency:
  group: refresh-amex
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |\n          npm ci || npm install\n          npx playwright install --with-deps chromium

      - name: Capture Amex campaign data
        env:
          AMEX_OUTPUT_DIR: data/imports
        run: node scripts/scrape-online.mjs

      - name: Build (schema + count guard)
        run: python3 scripts/build_amex.py --min-ratio 0.95

      - name: Geocode new or changed addresses
        run: python3 scripts/geocode.py --max ${{ github.event.inputs.geocode_max || '400' }}

      - name: Rebuild with new coordinates
        run: python3 scripts/build_amex.py --min-ratio 0.95

      - name: Protect legacy dataset
        run: |\n          if [[ -n $(git status --porcelain data.json) ]]; then\n            echo \"ERROR: legacy data.json must not change\"; exit 1\n          fi

      - name: Commit
        run: |\n          git config user.name \"github-actions[bot]\"\n          git config user.email \"github-actions[bot]@users.noreply.github.com\"\n          git add data/amex.json data/geocache.json data/imports data/history.json\n          if git diff --cached --quiet; then echo \"No changes\"; exit 0; fi\n          git commit -m \"Refresh Amex dataset $(date -u +%Y-%m-%d)\"\n          git push