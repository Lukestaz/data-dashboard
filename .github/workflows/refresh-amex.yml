# Keep this name stable: Pages and monitoring reference it in workflow_run.
# The schedule is daily despite the historical display name.
name: Refresh Amex dataset (twice weekly)

on:
  schedule:
    - cron: '17 7 * * *'
      timezone: 'Pacific/Auckland'
  workflow_dispatch:
    inputs:
      geocode_max:
        description: 'Max new addresses to geocode this run (~1-4 s each)'
        default: '1000'

permissions:
  contents: write

concurrency:
  group: refresh-amex
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate shared location cleanup rules
        run: node scripts/normalize_locations.mjs --test-only

      - name: Download and validate Amex campaign JSON directly
        run: python3 scripts/fetch_amex.py

      - name: Build (schema + count guard)
        run: python3 scripts/build_amex.py --min-ratio 0.95

      - name: Geocode new or changed addresses
        run: python3 scripts/geocode.py --max ${{ github.event.inputs.geocode_max || '400' }}

      - name: Rebuild with new coordinates
        run: python3 scripts/build_amex.py --min-ratio 0.95

      - name: Apply shared location hierarchy and validate output
        run: node scripts/normalize_locations.mjs

      - name: Protect legacy dataset
        run: |
          if [[ -n $(git status --porcelain data.json) ]]; then
            echo "ERROR: legacy data.json must not change"; exit 1
          fi

      - name: Commit refreshed dataset and history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/amex.json data/geocache.json data/imports data/history.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Refresh Amex dataset $(date -u +%Y-%m-%d)"
          git push
