name: Capture Amex Online Merchants — Stage Only

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture-online:
    name: Scrape Available Online Merchants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium

      - name: Run Online Scraper to Staging
        env:
          AMEX_OUTPUT_DIR: data/imports
        run: node scripts/scrape-online.mjs

      - name: Safety check
        run: |
          if [[ -n $(git status --porcelain data.json) ]]; then
            echo "ERROR: data.json must not be modified by this workflow."
            exit 1
          fi

      - name: Commit staged online capture
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status --porcelain data/imports) ]]; then
            git add data/imports
            git commit -m "Stage captured Amex Available Online merchants [skip ci]"
            git push origin main
          else
            echo "No changes in data/imports"
          fi
