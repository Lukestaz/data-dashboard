name: Create v1.3.0 tag

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tag-v1.3.0.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tag-v1.3.0
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create annotated tag without overwriting existing tags
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const version = 'v1.3.0';
            const target = 'cde105b0eee7da38e32f8029f6bf667647439ebe';
            const message = 'v1.3.0: location filters, map sidebar, viewport filtering and Actions monitoring';
            let existing;
            try {
              existing = (await github.rest.git.getRef({owner, repo, ref: `tags/${version}`})).data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (existing) {
              let object = existing.object;
              for (let depth = 0; object.type === 'tag' && depth < 10; depth++) {
                object = (await github.rest.git.getTag({owner, repo, tag_sha: object.sha})).data.object;
              }
              if (object.type !== 'commit' || object.sha !== target) {
                throw new Error(`${version} already exists at another target; refusing to move it.`);
              }
              core.info(`${version} already points to the approved commit.`);
            } else {
              await github.rest.git.getCommit({owner, repo, commit_sha: target});
              const tag = await github.rest.git.createTag({owner, repo, tag: version, message, object: target, type: 'commit'});
              await github.rest.git.createRef({owner, repo, ref: `refs/tags/${version}`, sha: tag.data.sha});
              core.info(`Created annotated ${version} at ${target}.`);
            }
            await core.summary.addHeading('v1.3.0 tag').addRaw(`Tag: ${version}\nCommit: ${target}\nNo GitHub Release created.`).write();
