name: Manual Amex Scrape — Review Before Publishing

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-to-staging:
    name: Scrape Amex data to staging only
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium

      - name: Run scraper to timestamped staging file
        env:
          AMEX_OUTPUT_DIR: data/imports
        run: |
          mkdir -p "$AMEX_OUTPUT_DIR"
          node scripts/scrape.mjs

      - name: Commit staged raw output only
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status --porcelain data/imports) ]]; then
            git add data/imports
            git commit -m "Stage Amex scrape output for review [skip ci]"
            git push origin main
          else
            echo "No new staged data was produced"
          fi

      - name: Safety check
        run: |
          if [[ -n $(git status --porcelain data.json) ]]; then
            echo "ERROR: Live data.json was modified. This workflow must never publish live data."
            exit 1
          fi
