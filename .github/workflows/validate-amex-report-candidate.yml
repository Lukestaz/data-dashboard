name: Validate AMEX report candidate

on:
  push:
    branches: [feature/amex-community-reports]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    if: github.repository == 'Lukestaz/data-dashboard' && github.ref == 'refs/heads/feature/amex-community-reports'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test strict candidate regeneration
        run: python3 scripts/prepare_amex_report_candidate.py --self-test
      - name: Apply candidate or verify published targets
        id: candidate
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          targets = {
              'js/community-reports.js': 'bc720ddd88d06b51175e2f06d4f1a9cfccca8329626f54314f249b9d56335f92',
              'js/votes.js': 'bc27387e874542de6941173dc3aa16143222bceb877cd06c37250a605641bfb8',
              'js/app.js': 'd68fbce43f9a67d938275289ffcb9e5d0bb426cca8538881253706c7ed7bae10',
              'js/cards.js': '770ba9ac2b881da76520efa31bfb5fc3ad4364bd6271e2087e9e3888d177d7ae',
              'js/compact-ui.js': '38422beb8bff3680fd457c0cff2d7d32b65b23b585e28896bd31adbec0275129',
              'index.html': '2e3b97f33a742a13362c4a770e568c7cd020b0e848351e22604cd69540d02e38',
              'tests/analytics.test.mjs': '96811fd4c499d7a4fbf17627db7c41c4e50200fe60708714049c0855c76763b3',
              'tests/votes-reader-integration.test.mjs': '57c7ca7807f2ae014a777b838ee0ba662ef03a5805cb21d9ca992864fd43d4ac',
              'README.md': '68ab4d6b76c892edb34ac2901d8b16c690a70e86f2c923585627d3851ab3db44',
              'js/community-report-controls.js': '92dfd57a2a0ebc0b8335ddb92de602375a24e638b3083006596908e95d980412',
              'tests/community-report-filter.test.mjs': '55c5f1f03e06cb5dd63365a9167867ec7f295292ba92de97355a01f78dd5aef2',
              'tests/community-reports.browser.mjs': '811e4637fb484e26075fb0d37a1ff85cfeb9fa6b248d537411d3fe8c15128ef7',
          }
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'amex-report-candidate'
          matched = all(pathlib.Path(p).is_file() and hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() == h for p, h in targets.items())
          if not matched:
              subprocess.run(['python3', 'scripts/prepare_amex_report_candidate.py', '--output', str(output)], check=True)
              result = json.loads((output / 'candidate-targets.json').read_text())
              assert result['fullContextPatchSha256'] == '525c7fbfea104b826cc00f781243593cd770171f8a7b1e77158165d70739ae64', 'Patch differs from approved artifact'
              assert result['targetSha256'] == targets, 'Targets differ from approved artifact'
          else:
              output.mkdir(parents=True, exist_ok=True)
              (output / 'candidate-targets.json').write_text(json.dumps({'checkedOutCommit': os.environ['GITHUB_SHA'], 'targetSha256': targets, 'verification': 'Published checkout matches pinned target hashes; tests run separately.'}, indent=2) + '\n')
          assert all(hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() == h for p, h in targets.items()), 'Target byte mismatch'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('publish=' + str(not matched).lower() + '\n')
          PY
      - name: Check actual patched source
        run: |
          python3 scripts/check_frontend.py --self-test
          python3 scripts/check_frontend.py
          node tests/community-reports.test.mjs
          node tests/community-vote-reader.test.mjs
          node tests/votes-reader-integration.test.mjs
          node tests/community-report-filter.test.mjs
          node tests/analytics.test.mjs js/analytics.js js/app.js
          node scripts/normalize_locations.mjs --test-only
          python3 scripts/dataset_diff.py --test-only
          python3 scripts/update_changelog.py --test-only
      - name: Build Tailwind and check built files
        run: |
          npx --yes tailwindcss@3.4.17 -c tailwind.config.js -i css/tailwind.src.css -o css/tailwind.css --minify
          python3 scripts/check_frontend.py
      - name: Record deferred browser verification
        run: echo "Browser/Leaflet verification is deferred to user manual testing; not verified by this run." >> "$GITHUB_STEP_SUMMARY"
      - name: Publish exact validated files to feature branch
        if: steps.candidate.outputs.publish == 'true'
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          result = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'amex-report-candidate/candidate-targets.json').read_text())
          targets = result['targetSha256']
          assert all(hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() == h for p, h in targets.items()), 'Tested target bytes changed'
          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', '--', *sorted(targets)], check=True)
          staged = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          assert staged == set(targets), 'Unexpected staged file set'
          subprocess.run(['git', 'commit', '-m', 'feat(reports): publish validated AMEX community reports filter'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/feature/amex-community-reports'], check=True)
          PY
      - name: Preserve regenerated patch and target hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amex-report-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/amex-report-candidate/
          if-no-files-found: warn
