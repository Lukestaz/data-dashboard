name: Validate AMEX report candidate

on:
  push:
    branches: [feature/amex-community-reports]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and apply candidate to this checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, json, pathlib, subprocess
          data = json.loads(pathlib.Path('candidate/amex-community-reports.json').read_text())
          for name, expected in data['expectedBlobs'].items():
              actual = subprocess.check_output(['git', 'hash-object', name], text=True).strip()
              if actual != expected:
                  raise SystemExit('Candidate needs reconciliation: ' + name)
          patch = gzip.decompress(base64.b64decode(data['patchGzipBase64'], validate=True))
          if hashlib.sha256(patch).hexdigest() != data['patchSha256']:
              raise SystemExit('Candidate checksum mismatch')
          target = pathlib.Path('/tmp/amex-community-reports.patch')
          target.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(target)], check=True)
          subprocess.run(['git', 'apply', str(target)], check=True)
          print('Applied exact candidate SHA256:', data['patchSha256'])
          PY
          git diff --check
      - name: Check actual patched source
        run: |
          python3 scripts/check_frontend.py --self-test
          python3 scripts/check_frontend.py
          node tests/community-reports.test.mjs
          node tests/community-vote-reader.test.mjs
          node tests/votes-reader-integration.test.mjs
          node tests/community-report-filter.test.mjs
          node tests/analytics.test.mjs js/analytics.js js/app.js
          node scripts/normalize_locations.mjs --test-only
          python3 scripts/dataset_diff.py --test-only
          python3 scripts/update_changelog.py --test-only
      - name: Build Tailwind and check built files
        run: |
          npx --yes tailwindcss@3.4.17 -c tailwind.config.js -i css/tailwind.src.css -o css/tailwind.css --minify
          python3 scripts/check_frontend.py
      - name: Install isolated browser dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/amex-browser" --no-save --ignore-scripts playwright@1.56.1 leaflet@1.9.4 leaflet.markercluster@1.5.3
          "$RUNNER_TEMP/amex-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Test actual patched files with Chromium and Leaflet
        env:
          AMEX_BROWSER_DEPS: ${{ runner.temp }}/amex-browser/node_modules
        run: node tests/community-reports.browser.mjs
