name: Monitor deployment and refresh runs

on:
  workflow_run:
    workflows: ['Deploy GitHub Pages', 'Refresh Amex dataset (twice weekly)']
    types: [completed]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: monitor-actions
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Collect and persist workflow status
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const path = 'data/ops/action-runs.json';
            const watched = ['pages.yml', 'refresh-amex.yml'];
            const runs = [];
            for (const workflow_id of watched) {
              const response = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id, branch: 'main', per_page: 30
              });
              for (const run of response.data.workflow_runs) {
                const entry = {
                  id: run.id, attempt: run.run_attempt, workflow: workflow_id,
                  name: run.name, event: run.event, status: run.status,
                  conclusion: run.conclusion, sha: run.head_sha,
                  createdAt: run.created_at, updatedAt: run.updated_at,
                  startedAt: run.run_started_at, url: run.html_url,
                  failedJobs: []
                };
                if (run.conclusion && run.conclusion !== 'success' && run.conclusion !== 'skipped') {
                  try {
                    const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                      owner, repo, run_id: run.id, filter: 'latest', per_page: 100
                    });
                    entry.failedJobs = jobs.filter(job => job.conclusion && job.conclusion !== 'success' && job.conclusion !== 'skipped').map(job => ({
                      name: job.name, conclusion: job.conclusion, url: job.html_url,
                      steps: (job.steps || []).filter(step => step.conclusion && step.conclusion !== 'success' && step.conclusion !== 'skipped').map(step => ({name: step.name, conclusion: step.conclusion}))
                    }));
                    if (!jobs.length) entry.note = 'No jobs returned. Inspect the run link for workflow validation errors.';
                  } catch (error) {
                    entry.jobLookupError = String(error.message).slice(0, 500);
                  }
                }
                runs.push(entry);
              }
            }
            runs.sort((a, b) => b.createdAt.localeCompare(a.createdAt) || b.id - a.id);
            const latest = {};
            for (const workflow of watched) latest[workflow] = runs.find(run => run.workflow === workflow) || null;
            const payload = {
              schemaVersion: 1, repository: `${owner}/${repo}`,
              checkedAt: new Date().toISOString(), latest, runs
            };
            const summary = watched.map(workflow => {
              const run = latest[workflow];
              return run ? `- ${workflow}: ${run.status} / ${run.conclusion || 'pending'} — ${run.sha.slice(0, 7)} — [run](${run.url})` : `- ${workflow}: no runs returned`;
            }).join('\n');
            await core.summary.addHeading('Deployment / refresh monitor').addRaw(summary).write();
            for (let attempt = 0; attempt < 3; attempt++) {
              let sha;
              try {
                const existing = await github.rest.repos.getContent({owner, repo, path, ref: 'main'});
                sha = existing.data.sha;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              try {
                await github.rest.repos.createOrUpdateFileContents({
                  owner, repo, path, branch: 'main', sha,
                  message: 'chore: record Actions run status [skip ci]',
                  content: Buffer.from(JSON.stringify(payload, null, 2) + '\n').toString('base64')
                });
                break;
              } catch (error) {
                if (attempt === 2 || ![409, 422].includes(error.status)) throw error;
                await new Promise(resolve => setTimeout(resolve, 1500));
              }
            }
