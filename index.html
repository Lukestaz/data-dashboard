<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amex Shop Small NZ Directory</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#006fcf', 600: '#005aa3', 700: '#004780' }
          }
        }
      }
    };
  </script>
  <style>
    .leaflet-popup-content-wrapper, .leaflet-popup-tip {
      background: #0f172a !important;
      color: #f8fafc !important;
      border: 1px solid #1e293b;
      border-radius: 0.75rem;
    }
    .leaflet-popup-content {
      margin: 14px 16px;
      line-height: 1.4;
    }
    .marker-cluster-small, .marker-cluster-medium, .marker-cluster-large {
      background-color: rgba(0, 111, 207, 0.4) !important;
    }
    .marker-cluster-small div, .marker-cluster-medium div, .marker-cluster-large div {
      background-color: #006fcf !important;
      color: white !important;
      font-weight: 700;
      font-family: inherit;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased">
  <div class="max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8">
    
    <!-- Header -->
    <header class="flex flex-col sm:flex-row sm:items-center sm:justify-between pb-5 border-b border-slate-800 gap-4">
      <div>
        <div class="flex items-center gap-2">
          <span class="px-2.5 py-0.5 rounded text-xs font-bold bg-blue-600 text-white tracking-wide">AMEX</span>
          <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white">Shop Small NZ Directory</h1>
        </div>
      </div>
      <div class="flex flex-wrap items-center gap-2.5">
        <!-- View Toggle -->
        <div class="bg-slate-900 p-1 rounded-lg border border-slate-800 flex items-center text-xs font-semibold">
          <button id="view-cards-btn" onclick="setViewMode('cards')" class="px-3 py-1.5 rounded-md transition bg-blue-600 text-white flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>
            <span>Cards</span>
          </button>
          <button id="view-map-btn" onclick="setViewMode('map')" class="px-3 py-1.5 rounded-md transition text-slate-400 hover:text-white flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" /></svg>
            <span>Map</span>
          </button>
        </div>

        <!-- Near Me Button -->
        <button id="near-me-btn" onclick="toggleNearMe()" class="bg-slate-900 hover:bg-slate-800 text-slate-300 hover:text-white px-3.5 py-2 rounded-lg border border-slate-800 text-xs font-semibold transition flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5 text-rose-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd" /></svg>
          <span id="near-me-label">Near Me</span>
        </button>

        <!-- Saved Filter Button -->
        <button id="saved-filter-btn" onclick="toggleSavedFilter()" class="bg-slate-900 hover:bg-slate-800 text-slate-300 hover:text-white px-3.5 py-2 rounded-lg border border-slate-800 text-xs font-semibold transition flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5 text-amber-400" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" /></svg>
          <span>Saved (<span id="saved-count">0</span>)</span>
        </button>

        <!-- Reset All Filters Button -->
        <button id="reset-all-btn" onclick="resetAllFilters()" title="Reset all active filters" class="bg-slate-900 hover:bg-rose-950/60 hover:text-rose-300 text-slate-400 px-3 py-2 rounded-lg border border-slate-800 text-xs font-medium transition flex items-center gap-1">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
          <span>Reset</span>
        </button>

        <select id="dataset-select" onchange="changeDataset(this.value)" title="Data source" class="bg-slate-900 border border-slate-800 text-slate-300 text-xs rounded-lg px-2.5 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="amex">Source: Amex (current)</option>
          <option value="legacy">Source: Cheapies (legacy)</option>
        </select>
        <span id="dataset-meta" class="hidden sm:inline text-[11px] text-slate-500"></span>

        <span class="bg-slate-900 px-3 py-2 rounded-lg border border-slate-800 text-xs text-slate-300">
          Total: <strong id="total-count" class="text-emerald-400">0</strong>
        </span>
      </div>
    </header>

    <!-- Controls -->
    <section class="mt-5 space-y-3">
      <!-- Search, City/Town Filter, and Sort -->
      <div class="flex flex-col sm:flex-row gap-3">
        <!-- Search Input with Clear Button -->
        <div class="relative flex-1">
          <input
            id="search-input"
            type="text"
            placeholder="Search by merchant name, street, or category..."
            class="w-full bg-slate-900 border border-slate-800 rounded-lg pl-10 pr-9 py-2.5 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
          <svg class="w-5 h-5 absolute left-3 top-2.5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
          <button id="clear-search-btn" onclick="clearSearch()" class="hidden absolute right-2.5 top-2.5 p-1 text-slate-500 hover:text-slate-300 rounded-full hover:bg-slate-800 transition" title="Clear search">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
          </button>
        </div>

        <!-- City / Town Grouped Select with Clear Button -->
        <div class="relative min-w-[240px]">
          <select
            id="town-select"
            onchange="handleTownChange(this.value)"
            class="w-full bg-slate-900 border border-slate-800 text-slate-300 text-sm rounded-lg pl-3 pr-16 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500 appearance-none"
          >
            <option value="All">All Cities & Towns (NZ-wide)</option>
          </select>
          <div class="absolute inset-y-0 right-0 flex items-center pr-2 gap-1">
            <button id="clear-town-btn" onclick="clearTown()" class="hidden p-1 text-slate-500 hover:text-slate-300 rounded-full hover:bg-slate-800 transition" title="Clear city/town">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
            </button>
            <div class="pointer-events-none text-slate-500 pr-1">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
            </div>
          </div>
        </div>

        <!-- Availability Select -->
        <div class="relative">
          <select
            id="avail-select"
            onchange="changeAvailability(this.value)"
            class="w-full sm:w-auto bg-slate-900 border border-slate-800 text-slate-300 text-sm rounded-lg pl-3 pr-8 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500 appearance-none"
          >
            <option value="all">All merchants</option>
            <option value="instore">In-store</option>
            <option value="online">Available Online</option>
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2.5 text-slate-500">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
          </div>
        </div>

        <!-- Sort Select -->
        <div class="relative">
          <select
            id="sort-select"
            onchange="changeSort(this.value)"
            class="w-full sm:w-auto bg-slate-900 border border-slate-800 text-slate-300 text-sm rounded-lg pl-3 pr-8 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500 appearance-none"
          >
            <option value="default">Default Order</option>
            <option value="distance">Distance (Nearest)</option>
            <option value="name">Name (A-Z)</option>
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2.5 text-slate-500">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
          </div>
        </div>
      </div>

      <!-- Categories Pills -->
      <div class="flex items-center gap-2 overflow-x-auto pb-1" id="category-pills"></div>
    </section>

    <!-- Map Container -->
    <div id="map-wrapper" class="mt-6 hidden relative rounded-2xl overflow-hidden border border-slate-800 h-[650px] shadow-2xl">
      <div id="map" class="w-full h-full"></div>
    </div>

    <!-- Cards Grid -->
    <main id="cards-wrapper" class="mt-6">
      <div id="card-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
      
      <!-- Infinite Scroll Sentinel -->
      <div id="sentinel" class="py-8 text-center">
        <p id="sentinel-text" class="text-xs text-slate-500">Showing top results</p>
      </div>

      <div id="empty-state" class="hidden text-center py-20">
        <p class="text-slate-400 text-base">No merchants found matching your query or filters.</p>
        <button onclick="resetAllFilters()" class="mt-3 px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs font-semibold transition">
          Reset All Filters
        </button>
      </div>
    </main>
  </div>

  <script>
    let merchants = [];
    let filteredList = [];
    let displayedCount = 60;
    const PAGE_CHUNK = 60;

    let activeCategory = 'All';
    let activeTown = 'All';
    let activeAvail = 'all';
    function changeAvailability(v) { activeAvail = v; displayedCount = PAGE_CHUNK; applyFilters(); }
    let currentSort = 'default';
    let showSavedOnly = false;
    let viewMode = 'cards';

    let userLat = null;
    let userLng = null;
    const DATASETS = { amex: './data/amex.json', legacy: './data.json' };
    let activeDataset = localStorage.getItem('merchant_dataset') || 'amex';
    if (!DATASETS[activeDataset]) activeDataset = 'amex';
    const savedKey = () => activeDataset === 'legacy' ? 'amex_saved_merchants' : 'amex_saved_merchants_' + activeDataset;
    let savedIds = new Set(JSON.parse(localStorage.getItem(savedKey()) || '[]'));
    function changeDataset(v) {
      localStorage.setItem('merchant_dataset', v);
      location.reload();
    }

    let map = null;
    let markerCluster = null;

    async function init() {
      updateSavedCount();
      try {
        document.getElementById('dataset-select').value = activeDataset;
        const res = await fetch(DATASETS[activeDataset]);
        if (res.ok) {
          const body = await res.json();
          merchants = Array.isArray(body) ? body : (body.merchants || []);
          if (body.meta && body.meta.capturedAt) {
            document.getElementById('dataset-meta').textContent = 'Updated ' + new Date(body.meta.capturedAt).toLocaleDateString('en-NZ');
          }
          if (activeDataset === 'legacy') {
            const opt = document.querySelector('#avail-select option[value="online"]');
            if (opt) { opt.disabled = true; opt.textContent = 'Available Online (Amex source only)'; }
          }
          cleanCityTownField();
        }
      } catch (err) {
        console.error('Failed to load data.json', err);
      }

      populateTownFilter();
      populateCategoryPills();
      applyFilters();
      setupInfiniteScroll();
    }

    function cleanCityTownField() {
      const aucklandSuburbs = new Set([
        'albany', 'alfriston', 'arch hill', 'ardmore', 'auckland central', 'auckland 1010', 'auckland 1060',
        'avondale', 'balmoral', 'beach haven', 'beachlands', 'belmont', 'birkdale', 'birkenhead', 'blockhouse bay',
        'bombay', 'botany downs', 'brookby', 'browns bay', 'bucklands beach', 'castor bay', 'cbd', 'cheltenham',
        'clarks beach', 'clevedon', 'coatesville', 'cockle bay', 'dannemora', 'devonport', 'drury', 'east tamaki',
        'east tāmaki', 'eastern beach', 'eden terrace', 'ellerslie', 'epsom', 'flat bush', 'forrest hill', 'freemans bay',
        'glen eden', 'glen innes', 'glenbrook', 'glenfield', 'glendene', 'glendowie', 'golflands', 'grafton', 'greenbay',
        'greenhithe', 'greenlane', 'grey lynn', 'half moon bay', 'helensville', 'henderson', 'herald island', 'herne bay',
        'highbrook', 'highland park', 'hillsborough', 'hobsonville', 'hobsonville point', 'howick', 'huapai', 'huia',
        'karaka', 'karekare', 'kaukapakapa', 'kelston', 'kingsland', 'kingseat', 'kohimarama', 'kumeu', 'kumeū',
        'laneway', 'lynfield', 'mairangi bay', 'mangere', 'māngere', 'mangere bridge', 'manukau', 'manukau city centre',
        'manurewa', 'maraetai', 'meadowbank', 'mellons bay', 'middlemore', 'milford', 'mission bay',
        'morningside', 'mount albert', 'mount eden', 'mount roskill', 'mount wellington', 'mt albert', 'mt eden',
        'mt roskill', 'mt wellington', 'murrays bay', 'new lynn', 'newmarket', 'newton', 'northcote', 'one tree hill',
        'onehunga', 'oneroa', 'onetangi', 'orewa', 'ōrewa', 'orakei', 'ōrākei', 'otahuhu', 'ōtāhuhu', 'otara',
        'ōtara', 'pakuranga', 'panmure', 'papakura', 'papatoetoe', 'parakai', 'parnell', 'patumahoe', 'penrose',
        'piha', 'point chevalier', 'point england', 'ponsonby', 'puhinui', 'red beach', 'red hill',
        'remuera', 'riverhead', 'rosedale', 'royal oak', 'saint heliers', 'saint johns', 'saint marys bay', 'sandringham',
        'silverdale', 'snells beach', 'st heliers', 'st johns', 'st marys bay', 'stanmore bay', 'sunnyvale', 'swanson',
        'takapuna', 'te atatu', 'te atatū', 'te atatu peninsula', 'te atatu south', 'te papapa', 'three kings', 'titirangi',
        'torbay', 'tuakau', 'waimauku', 'wairau valley', 'waitakere', 'waitoki', 'waiwera',
        'waterview', 'west harbour', 'western springs', 'westfield', 'westgate', 'westmere', 'weiti', 'weiti crossing',
        'whangaparaoa', 'whangaparāoa', 'whenuapai', 'whitford'
      ]);

      const chchSuburbs = new Set([
        'addington', 'aranui', 'avondale', 'avonhead', 'avonside', 'beckenham', 'belfast', 'bexley', 'bishopdale',
        'bromley', 'bryndwr', 'burnside', 'casebrook', 'cashmere', 'clifton', 'edgeware', 'fenalton', 'ferrymead',
        'fendalton', 'halswell', 'harewood', 'heathcote valley', 'hei hei', 'hornby', 'hoon hay', 'ilam', 'islington',
        'kennedys bush', 'linwood', 'mairehau', 'merivale', 'moncks bay', 'mount pleasant', 'new regent street',
        'new brighton', 'opawa', 'papanui', 'parklands', 'phillipstown', 'redcliffs', 'riccarton', 'richmond',
        'saint albans', 'saint martins', 'shirley', 'sockburn', 'somerfield', 'southshore', 'spencerville', 'spreydon',
        'st albans', 'st martins', 'strowan', 'sumner', 'sydenham', 'templeton', 'upper riccarton', 'waimairi beach',
        'wainoni', 'waltham', 'woolston', 'yaldhurst'
      ]);

      const wellingtonSuburbs = new Set([
        'aro valley', 'berhampore', 'breaker bay', 'broadmeadows', 'brooklyn', 'churton park', 'crofton downs',
        'glenside', 'grenada north', 'grenada village', 'hataitai', 'horokiwi', 'houghton bay', 'island bay',
        'johnsonville', 'kaiwharawhara', 'karori', 'kelburn', 'khandallah', 'kilbirnie', 'lyall bay', 'makara',
        'maupuia', 'miramar', 'mornington', 'mount cook', 'mount victoria', 'newtown', 'ngaio', 'ngauranga',
        'oriental bay', 'owhiro bay', 'pipitea', 'roseneath', 'seatoun', 'shelly bay', 'strathmore park',
        'tawa', 'te aro', 'thorndon', 'voges town', 'wadestown', 'wellington central', 'wellington 6011',
        'wellington north', 'wilton', 'woodridge'
      ]);

      const hamiltonSuburbs = new Set([
        'bader', 'beerescourt', 'chartwell', 'claudelands', 'dinadale', 'enderley', 'fairfield', 'fairview downs',
        'fitzroy', 'flagstaff', 'frankton', 'glenview', 'hamilton central', 'hamilton east', 'hamilton north',
        'harrowfield', 'hillcrest', 'maeroa', 'melville', 'nawton', 'netherby', 'peacocke', 'pukete', 'queenwood',
        'riverlea', 'rotokauri', 'rototuna', 'ruakura', 'silverdale', 'st andrews', 'te rapa', 'whitiora'
      ]);

      const taurangaSuburbs = new Set([
        'bethlehem', 'brookfield', 'gate pa', 'greerton', 'hairini', 'judea', 'matua', 'maungatapu', 'mount maunganui',
        'mt maunganui', 'otumoetai', 'pāpāmoa', 'papamoa', 'papamoa beach', 'pyes pa', 'tauriko', 'welcome bay'
      ]);

      const dunedinSuburbs = new Set([
        'andersons bay', 'belleknowes', 'caversham', 'dunedin central', 'forbury', 'halfway bush', 'hillsborough',
        'kew', 'mornington', 'mosgiel', 'north east valley', 'opaho', 'oupo', 'port chalmers', 'roslyn',
        'saint clair', 'saint kilda', 'st clair', 'st kilda', 'south dunedin', 'waikouaiti'
      ]);

      for (const m of merchants) {
        if (m.inStore === false) { m.canonicalCity = ''; m.localArea = ''; continue; }
        const raw = (m.cleanTown || m.town || m.city || m['City / Town'] || '').replace(/\s+\d{4}$/, '').trim();
        const low = raw.toLowerCase();
        const addr = (m.address || '').toLowerCase();
        const reg = (m.region || '').toLowerCase();

        let canonical = raw;

        if (['&', ':', 'beach', 'central', 'city', 'hw', 'junction', 'laneway', 'off', 'south', 'north', 'west', 'east', ''].includes(low) || /^\d+$/.test(low)) {
          if (addr.includes('auckland') || reg.includes('auckland')) canonical = 'Auckland';
          else if (addr.includes('christchurch') || reg.includes('canterbury')) canonical = 'Christchurch';
          else if (addr.includes('wellington')) canonical = 'Wellington';
          else if (addr.includes('hamilton') || reg.includes('waikato')) canonical = 'Hamilton';
          else if (addr.includes('tauranga') || reg.includes('bay of plenty')) canonical = 'Tauranga';
          else if (addr.includes('queenstown') || reg.includes('otago')) canonical = 'Queenstown';
          else canonical = 'Other';
        } else if (aucklandSuburbs.has(low) || addr.includes('auckland')) {
          canonical = 'Auckland';
        } else if (chchSuburbs.has(low) || low === 'canterbury') {
          canonical = 'Christchurch';
        } else if (wellingtonSuburbs.has(low) || low === 'wellington') {
          canonical = 'Wellington';
        } else if (hamiltonSuburbs.has(low) || low === 'hamilton') {
          canonical = 'Hamilton';
        } else if (taurangaSuburbs.has(low) || low === 'tauranga') {
          canonical = 'Tauranga';
        } else if (dunedinSuburbs.has(low) || low === 'dunedin') {
          canonical = 'Dunedin';
        } else if (low.includes('queenstown') || low.includes('arrowtown')) {
          canonical = 'Queenstown';
        } else if (low.includes('wanaka') || low.includes('wānaka')) {
          canonical = 'Wānaka';
        } else {
          canonical = raw.charAt(0).toUpperCase() + raw.slice(1);
        }

        m.canonicalCity = canonical;
        m.localArea = raw && raw !== canonical && raw !== '&' && raw !== ':' && !/^\d+$/.test(raw) ? raw : '';
      }
    }

    function populateTownFilter() {
      const townCounts = {};
      for (const m of merchants) {
        if (m.inStore === false) continue;
        const t = m.canonicalCity || 'Other';
        townCounts[t] = (townCounts[t] || 0) + 1;
      }

      const major = [];
      const regional = [];
      const local = [];

      for (const [t, count] of Object.entries(townCounts)) {
        if (count >= 30) major.push({ name: t, count });
        else if (count >= 6) regional.push({ name: t, count });
        else local.push({ name: t, count });
      }

      major.sort((a, b) => b.count - a.count);
      regional.sort((a, b) => a.name.localeCompare(b.name));
      local.sort((a, b) => a.name.localeCompare(b.name));

      const townSelect = document.getElementById('town-select');
      townSelect.innerHTML = '<option value="All">All Cities & Towns (NZ-wide)</option>' +
        '<optgroup label="🌟 Major Cities & Metros">' +
        major.map(item => `<option value="${item.name}">${item.name} (${item.count.toLocaleString()})</option>`).join('') +
        '</optgroup>' +
        '<optgroup label="📍 Regional Towns & Districts">' +
        regional.map(item => `<option value="${item.name}">${item.name} (${item.count})</option>`).join('') +
        '</optgroup>' +
        '<optgroup label="🏡 Local Communities">' +
        local.map(item => `<option value="${item.name}">${item.name} (${item.count})</option>`).join('') +
        '</optgroup>';
    }

    function handleTownChange(val) {
      activeTown = val;
      const clearBtn = document.getElementById('clear-town-btn');
      if (val === 'All') {
        clearBtn.classList.add('hidden');
      } else {
        clearBtn.classList.remove('hidden');
      }
      applyFilters();
    }

    function clearTown() {
      document.getElementById('town-select').value = 'All';
      handleTownChange('All');
    }

    function clearSearch() {
      const input = document.getElementById('search-input');
      input.value = '';
      document.getElementById('clear-search-btn').classList.add('hidden');
      applyFilters();
    }

    function resetAllFilters() {
      document.getElementById('search-input').value = '';
      document.getElementById('clear-search-btn').classList.add('hidden');
      document.getElementById('town-select').value = 'All';
      handleTownChange('All');
      activeCategory = 'All';
      populateCategoryPills();
      showSavedOnly = false;
      const savedBtn = document.getElementById('saved-filter-btn');
      savedBtn.classList.remove('bg-amber-500/20', 'border-amber-500/50', 'text-amber-300');
      document.getElementById('sort-select').value = 'default';
      document.getElementById('avail-select').value = 'all';
      activeAvail = 'all';
      currentSort = 'default';
      if (userLat !== null) {
        userLat = null;
        userLng = null;
        document.getElementById('near-me-label').textContent = 'Near Me';
        document.getElementById('near-me-btn').classList.remove('bg-rose-500/20', 'border-rose-500/50', 'text-rose-300');
      }
      applyFilters();
    }

    function populateCategoryPills() {
      const categories = ['All', ...new Set(merchants.map(m => m.category || m.Type).filter(Boolean))].sort();
      const catContainer = document.getElementById('category-pills');
      catContainer.innerHTML = categories.map(cat => `
        <button
          onclick="selectCategory('${cat}')"
          class="px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-colors ${
            activeCategory === cat
              ? 'bg-blue-600 text-white shadow-sm'
              : 'bg-slate-900 text-slate-300 hover:bg-slate-800 border border-slate-800'
          }"
        >
          ${cat}
        </button>
      `).join('');
    }

    function selectCategory(cat) {
      activeCategory = cat;
      populateCategoryPills();
      applyFilters();
    }

    document.getElementById('search-input').addEventListener('input', (e) => {
      const clearBtn = document.getElementById('clear-search-btn');
      if (e.target.value.trim()) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }
      applyFilters();
    });

    function changeSort(val) {
      currentSort = val;
      if (val === 'distance' && userLat === null) {
        toggleNearMe();
        return;
      }
      applyFilters();
    }

    function updateSavedCount() {
      document.getElementById('saved-count').textContent = savedIds.size;
    }

    function toggleSave(id, e) {
      if (e) e.stopPropagation();
      if (savedIds.has(id)) savedIds.delete(id);
      else savedIds.add(id);
      localStorage.setItem(savedKey(), JSON.stringify([...savedIds]));
      updateSavedCount();
      if (showSavedOnly) applyFilters();
      else renderCardsChunk();
    }

    function toggleSavedFilter() {
      showSavedOnly = !showSavedOnly;
      const btn = document.getElementById('saved-filter-btn');
      if (showSavedOnly) {
        btn.classList.add('bg-amber-500/20', 'border-amber-500/50', 'text-amber-300');
      } else {
        btn.classList.remove('bg-amber-500/20', 'border-amber-500/50', 'text-amber-300');
      }
      applyFilters();
    }

    function toggleNearMe() {
      if (userLat !== null) {
        userLat = null;
        userLng = null;
        document.getElementById('near-me-label').textContent = 'Near Me';
        document.getElementById('near-me-btn').classList.remove('bg-rose-500/20', 'border-rose-500/50', 'text-rose-300');
        document.getElementById('sort-select').value = 'default';
        currentSort = 'default';
        applyFilters();
        return;
      }

      if (!navigator.geolocation) {
        alert('Geolocation is not supported by your browser.');
        return;
      }

      const label = document.getElementById('near-me-label');
      label.textContent = 'Locating...';

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          userLat = pos.coords.latitude;
          userLng = pos.coords.longitude;
          label.textContent = 'Nearby Active';
          document.getElementById('near-me-btn').classList.add('bg-rose-500/20', 'border-rose-500/50', 'text-rose-300');
          document.getElementById('sort-select').value = 'distance';
          currentSort = 'distance';
          calculateDistances();
          applyFilters();
          if (map && viewMode === 'map') {
            map.setView([userLat, userLng], 13);
          }
        },
        (err) => {
          alert('Location access denied or unavailable: ' + err.message);
          label.textContent = 'Near Me';
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    function calculateDistances() {
      if (userLat === null) return;
      for (const m of merchants) {
        if (m.lat && m.lng) {
          m._dist = haversine(userLat, userLng, m.lat, m.lng);
        } else {
          m._dist = Infinity;
        }
      }
    }

    function haversine(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function applyFilters() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();

      filteredList = merchants.filter(m => {
        const cat = m.category || m.Type || '';
        const town = m.canonicalCity || '';
        const isSaved = savedIds.has(m.id);

        if (showSavedOnly && !isSaved) return false;
        if (activeCategory !== 'All' && cat !== activeCategory) return false;
        if (activeTown !== 'All' && town !== activeTown) return false;
        if (activeAvail === 'online' && !m.isOnline) return false;
        if (activeAvail === 'instore' && m.inStore === false) return false;

        if (query) {
          const matchTitle = (m.title || m.Name || '').toLowerCase().includes(query);
          const matchAddr = (m.address || m.Address || '').toLowerCase().includes(query);
          const matchTown = town.toLowerCase().includes(query);
          const matchLocal = (m.localArea || '').toLowerCase().includes(query);
          const matchType = (m.subType || m['Sub-type (original)'] || '').toLowerCase().includes(query) || (m.website || '').includes(query);
          if (!matchTitle && !matchAddr && !matchTown && !matchLocal && !matchType) return false;
        }
        return true;
      });

      if (currentSort === 'distance') {
        calculateDistances();
        filteredList.sort((a, b) => (a._dist || Infinity) - (b._dist || Infinity));
      } else if (currentSort === 'name') {
        filteredList.sort((a, b) => (a.title || '').localeCompare(b.title || ''));
      }

      document.getElementById('total-count').textContent = filteredList.length.toLocaleString();
      displayedCount = PAGE_CHUNK;

      renderCardsChunk();

      if (viewMode === 'map') {
        updateMapMarkers();
      }
    }

    function renderCardsChunk() {
      const grid = document.getElementById('card-grid');
      const empty = document.getElementById('empty-state');
      const sentinelText = document.getElementById('sentinel-text');

      if (filteredList.length === 0) {
        grid.innerHTML = '';
        empty.classList.remove('hidden');
        sentinelText.textContent = '';
        return;
      }

      empty.classList.add('hidden');
      const slice = filteredList.slice(0, displayedCount);

      grid.innerHTML = slice.map(item => {
        const title = item.title || item.Name || 'Merchant';
        const cat = item.category || item.Type || 'Retail';
        const subType = item.subType || item['Sub-type (original)'] || '';
        const town = item.canonicalCity || '';
        const local = item.localArea || '';
        const address = item.address || item.Address || '';
        const lat = item.lat || item.Latitude;
        const lng = item.lng || item.Longitude;
        const isSaved = savedIds.has(item.id);

        const mapsUrl = lat && lng && item.loc !== 'approx'
          ? `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`
          : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(title + ' ' + address)}`;

        const reviewsUrl = `https://www.google.com/search?q=${encodeURIComponent(title + ' ' + (local || town) + ' New Zealand reviews')}`;

        let distanceBadge = '';
        if (item._dist !== undefined && item._dist !== Infinity) {
          distanceBadge = item._dist < 1
            ? `<span class="bg-rose-950/80 text-rose-300 border border-rose-800/50 px-2 py-0.5 rounded text-[11px] font-bold">${Math.round(item._dist * 1000)}m away</span>`
            : `<span class="bg-rose-950/80 text-rose-300 border border-rose-800/50 px-2 py-0.5 rounded text-[11px] font-bold">${item._dist.toFixed(1)} km</span>`;
        }

        const locationLabel = [local, town && town !== local ? town : ''].filter(Boolean).join(', ');

        return `
          <div class="bg-slate-900 border border-slate-800/90 hover:border-slate-700 rounded-xl p-5 transition shadow-sm flex flex-col justify-between relative group">
            <div>
              <div class="flex items-center justify-between text-xs mb-3 gap-2">
                <div class="flex items-center gap-1.5 flex-wrap">
                  <span class="px-2.5 py-0.5 rounded-full bg-blue-950 text-blue-300 font-medium border border-blue-900/40">${cat}</span>
                  ${distanceBadge}
                  ${item.isOnline ? `<span class="px-2 py-0.5 rounded bg-emerald-950 text-emerald-300 border border-emerald-800/50 text-[11px] font-bold">${item.inStore === false ? 'Online only' : 'Also online'}</span>` : ''}
                  ${item.inStore !== false && !(lat && lng) ? `<span class="px-2 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700 text-[11px]" title="No reliable map location found yet">No map location</span>` : ''}
                  ${item.loc === 'approx' ? `<span class="px-2 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700 text-[11px]" title="Pin placed at the postcode centre; exact address lookup pending">Approx. location</span>` : ''}
                </div>
                <button onclick="toggleSave(${item.id}, event)" class="p-1 rounded-md text-slate-500 hover:text-amber-400 transition" title="Save to Favorites">
                  <svg class="w-5 h-5 ${isSaved ? 'text-amber-400 fill-current' : 'fill-none stroke-current'}" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z" />
                  </svg>
                </button>
              </div>
              <h3 class="text-base font-bold text-white mb-1 leading-snug">${title}</h3>
              ${subType ? `<p class="text-xs text-blue-400/90 mb-1.5 font-medium">${subType}</p>` : ''}
              ${locationLabel ? `<p class="text-xs font-semibold text-slate-400 mb-1 flex items-center gap-1"><svg class="w-3.5 h-3.5 text-slate-500 inline shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd" /></svg>${locationLabel}</p>` : ''}
              ${address ? `<p class="text-xs text-slate-400 line-clamp-2 mb-3">${address}</p>` : ''}
            </div>
            <div class="pt-3 border-t border-slate-800/80 flex items-center justify-between text-xs gap-2">
              <a href="${reviewsUrl}" target="_blank" rel="noopener noreferrer" class="text-amber-400 hover:text-amber-300 font-semibold inline-flex items-center gap-1 hover:underline">
                <svg class="w-3.5 h-3.5 fill-current text-amber-400" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" /></svg>
                <span>Reviews</span>
              </a>
              ${item.website ? `<a href="${item.website}" target="_blank" rel="noopener noreferrer" class="text-emerald-400 hover:text-emerald-300 font-semibold">Website &rarr;</a>` : ''}
              ${item.inStore !== false ? `<a href="${mapsUrl}" target="_blank" rel="noopener noreferrer" class="text-blue-400 hover:text-blue-300 font-semibold inline-flex items-center gap-1">Directions &rarr;</a>` : ''}
            </div>
          </div>
        `;
      }).join('');

      sentinelText.textContent = displayedCount >= filteredList.length
        ? `Showing all ${filteredList.length.toLocaleString()} matches`
        : `Showing ${displayedCount} of ${filteredList.length.toLocaleString()} (scroll down for more)`;
    }

    function setupInfiniteScroll() {
      const sentinel = document.getElementById('sentinel');
      const observer = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting) {
          if (displayedCount < filteredList.length) {
            displayedCount += PAGE_CHUNK;
            renderCardsChunk();
          }
        }
      }, { rootMargin: '300px' });
      observer.observe(sentinel);
    }

    function setViewMode(mode) {
      viewMode = mode;
      const cardsWrapper = document.getElementById('cards-wrapper');
      const mapWrapper = document.getElementById('map-wrapper');
      const cardsBtn = document.getElementById('view-cards-btn');
      const mapBtn = document.getElementById('view-map-btn');

      if (mode === 'map') {
        cardsWrapper.classList.add('hidden');
        mapWrapper.classList.remove('hidden');
        mapBtn.classList.add('bg-blue-600', 'text-white');
        mapBtn.classList.remove('text-slate-400');
        cardsBtn.classList.remove('bg-blue-600', 'text-white');
        cardsBtn.classList.add('text-slate-400');

        initMapIfNeeded();
        setTimeout(() => {
          if (map) {
            map.invalidateSize();
            updateMapMarkers();
          }
        }, 150);
      } else {
        mapWrapper.classList.add('hidden');
        cardsWrapper.classList.remove('hidden');
        cardsBtn.classList.add('bg-blue-600', 'text-white');
        cardsBtn.classList.remove('text-slate-400');
        mapBtn.classList.remove('bg-blue-600', 'text-white');
        mapBtn.classList.add('text-slate-400');
      }
    }

    function initMapIfNeeded() {
      if (map) return;
      map = L.map('map', {
        center: userLat && userLng ? [userLat, userLng] : [-36.85, 174.76],
        zoom: 12
      });

      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        maxZoom: 19
      }).addTo(map);

      markerCluster = L.markerClusterGroup({
        chunkedLoading: true,
        maxClusterRadius: 50
      });
      map.addLayer(markerCluster);
    }

    function updateMapMarkers() {
      if (!map || !markerCluster) return;
      markerCluster.clearLayers();

      const markers = [];
      const matches = filteredList.filter(m => m.lat && m.lng).slice(0, 1500);

      for (const item of matches) {
        const title = item.title || item.Name || 'Merchant';
        const cat = item.category || item.Type || '';
        const address = item.address || '';
        const town = item.canonicalCity || '';
        const local = item.localArea || '';
        const mapsUrl = item.loc === 'approx' ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(title + ' ' + address)}` : `https://www.google.com/maps/search/?api=1&query=${item.lat},${item.lng}`;
        const reviewsUrl = `https://www.google.com/search?q=${encodeURIComponent(title + ' ' + (local || town) + ' New Zealand reviews')}`;

        const marker = L.marker([item.lat, item.lng]);
        marker.bindPopup(`
          <div class="text-slate-100 font-sans">
            <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-blue-900/60 text-blue-300 border border-blue-700/40">${cat}</span>
            <h4 class="text-sm font-bold text-white mt-1.5">${title}</h4>
            <p class="text-xs text-slate-400 mt-1">${address}</p>
            ${item.loc === 'approx' ? '<p class="text-[10px] text-slate-500 mt-1">Approximate (postcode centre)</p>' : ''}
            <div class="mt-3 pt-2 border-t border-slate-800 flex items-center justify-between text-xs">
              <a href="${reviewsUrl}" target="_blank" rel="noopener noreferrer" class="text-amber-400 font-bold hover:underline flex items-center gap-1">
                ⭐ Reviews
              </a>
              ${item.website ? `<a href="${item.website}" target="_blank" rel="noopener noreferrer" class="text-emerald-400 font-bold hover:underline">Website</a>` : ''}
              <a href="${mapsUrl}" target="_blank" rel="noopener noreferrer" class="text-blue-400 font-bold hover:underline">Directions &rarr;</a>
            </div>
          </div>
        `);
        markers.push(marker);
      }

      markerCluster.addLayers(markers);

      if (matches.length > 0 && !userLat) {
        const bounds = L.latLngBounds(matches.map(m => [m.lat, m.lng]));
        map.fitBounds(bounds, { padding: [40, 40], maxZoom: 14 });
      }
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
