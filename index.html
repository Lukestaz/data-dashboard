<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amex Shop Small NZ Directory</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cloud.umami.is/script.js" data-website-id="eaa878dc-564a-4fac-b0ea-2187e288a0cf"></script>
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              blue: '#006fcf',
              dark: '#002663',
            }
          }
        }
      }
    };
  </script>
  <style>
    .leaflet-popup-content-wrapper, .leaflet-popup-tip {
      background: #0f172a !important;
      color: #f8fafc !important;
      border: 1px solid #1e293b;
      border-radius: 0.75rem;
    }
    .leaflet-popup-content {
      margin: 14px 16px;
      line-height: 1.4;
    }
    .marker-cluster-small, .marker-cluster-medium, .marker-cluster-large {
      background-color: rgba(0, 111, 207, 0.4) !important;
    }
    .marker-cluster-small div, .marker-cluster-medium div, .marker-cluster-large div {
      background-color: #006fcf !important;
      color: white !important;
      font-weight: 700;
      font-family: inherit;
    }
  </style>
  <!-- Main ES Module Entrypoint -->
  <script type="module" src="./js/app.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased">

  <!-- Amex Offer Reminder Modal -->
  <div id="offer-notice" class="hidden fixed inset-0 z-[1000] bg-slate-950/80 backdrop-blur-sm items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="offer-notice-title">
    <div class="w-full max-w-md rounded-2xl border border-blue-500/30 bg-slate-900 p-6 shadow-2xl">
      <div class="mb-4 flex items-center gap-2">
        <span class="rounded bg-blue-600 px-2.5 py-0.5 text-xs font-bold tracking-wide text-white">AMEX</span>
        <span class="text-xs font-semibold text-blue-300">Shop Small reminder</span>
      </div>
      <h2 id="offer-notice-title" class="text-xl font-extrabold text-white">Activate your Amex offer first</h2>
      <p class="mt-2 text-sm leading-6 text-slate-300">Add it in the Amex app before paying to receive cashback.</p>
      <button type="button" onclick="document.getElementById('offer-notice').classList.add('hidden')" class="mt-6 w-full rounded-lg bg-blue-600 px-4 py-2.5 text-sm font-bold text-white transition hover:bg-blue-500">Got it</button>
    </div>
  </div>

  <div class="max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8">
    <!-- Header -->
    <header class="flex flex-col sm:flex-row sm:items-center sm:justify-between pb-5 border-b border-slate-800 gap-4">
      <div>
        <div class="flex items-center gap-2">
          <span class="px-2.5 py-0.5 rounded text-xs font-bold bg-blue-600 text-white tracking-wide">AMEX</span>
          <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white">Shop Small NZ Directory</h1>
        </div>
        <p class="text-xs sm:text-sm text-slate-400 mt-1">10,839 participating American Express merchants across New Zealand</p>
      </div>
      <div class="flex flex-wrap items-center gap-2.5">
        <div class="bg-slate-900 p-1 rounded-lg border border-slate-800 flex items-center text-xs font-semibold">
          <button id="view-cards-btn" onclick="setViewMode('cards')" class="px-3 py-1.5 rounded-md transition bg-blue-600 text-white flex items-center gap-1.5"><span>Cards</span></button>
          <button id="view-map-btn" onclick="setViewMode('map')" class="px-3 py-1.5 rounded-md transition text-slate-400 hover:text-white flex items-center gap-1.5"><span>Map</span></button>
        </div>
        <span class="bg-slate-900 px-3 py-2 rounded-lg border border-slate-800 text-xs text-slate-300">Total: <strong id="total-count" class="text-emerald-400">0</strong></span>
      </div>
    </header>

    <!-- Controls -->
    <section class="mt-5 space-y-3">
      <div class="flex flex-col sm:flex-row gap-3">
        <div class="relative flex-1">
          <input id="search-input" type="text" placeholder="Search by merchant name, suburb, street, or category..." class="w-full bg-slate-900 border border-slate-800 rounded-lg pl-10 pr-4 py-2.5 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
      </div>
      <div class="flex items-center gap-2 overflow-x-auto pb-1" id="category-pills"></div>
    </section>

    <!-- Map Container -->
    <div id="map-wrapper" class="mt-6 hidden relative rounded-2xl overflow-hidden border border-slate-800 h-[650px] shadow-2xl">
      <div id="map" class="w-full h-full"></div>
    </div>

    <!-- Cards Grid -->
    <main id="cards-wrapper" class="mt-6">
      <div id="card-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
      <div id="sentinel" class="py-8 text-center"><p id="sentinel-text" class="text-xs text-slate-500">Showing top results</p></div>
      <div id="empty-state" class="hidden text-center py-20"><p class="text-slate-400 text-base">No merchants found matching your query or filters.</p></div>
    </main>
  </div>
</body>
</html>
