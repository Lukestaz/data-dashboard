<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amex Shop Small NZ Directory</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#006fcf', 600: '#005aa3', 700: '#004780' }
          }
        }
      }
    };
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased">
  <div class="max-w-7xl mx-auto px-4 py-8 sm:px-6 lg:px-8">
    <header class="flex flex-col sm:flex-row sm:items-center sm:justify-between pb-6 border-b border-slate-800 gap-4">
      <div>
        <div class="flex items-center gap-2">
          <span class="px-2.5 py-0.5 rounded text-xs font-bold bg-blue-600 text-white tracking-wide">AMEX</span>
          <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white">Shop Small NZ Directory</h1>
        </div>
        <p class="text-sm text-slate-400 mt-1">Interactive merchant finder for participating American Express businesses in New Zealand</p>
      </div>
      <div class="flex flex-wrap items-center gap-3 text-sm">
        <label class="cursor-pointer bg-slate-900 hover:bg-slate-800 text-slate-300 px-3.5 py-1.5 rounded-lg border border-slate-700 text-xs font-medium transition flex items-center gap-1.5">
          <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>
          <span>Load Full Dataset (JSON/CSV)</span>
          <input type="file" id="file-uploader" accept=".json,.csv" class="hidden" />
        </label>
        <span class="bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-800 text-xs text-slate-300">
          Showing: <strong id="total-count" class="text-emerald-400">0</strong>
        </span>
      </div>
    </header>

    <section class="mt-6 space-y-4">
      <div class="flex flex-col sm:flex-row gap-3">
        <div class="relative flex-1">
          <input
            id="search-input"
            type="text"
            placeholder="Search by merchant name, street, suburb, or keyword..."
            class="w-full bg-slate-900 border border-slate-800 rounded-lg pl-10 pr-4 py-2.5 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
          <svg class="w-5 h-5 absolute left-3 top-2.5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </div>
        <select
          id="city-select"
          class="bg-slate-900 border border-slate-800 text-slate-300 text-sm rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500 min-w-[160px]"
        >
          <option value="All">All Cities / Towns</option>
        </select>
      </div>

      <div class="flex items-center gap-2 overflow-x-auto pb-1" id="category-pills"></div>
    </section>

    <main class="mt-8">
      <div id="card-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
      <div id="empty-state" class="hidden text-center py-20">
        <p class="text-slate-400 text-base">No merchants found matching your query or filters.</p>
      </div>
    </main>
  </div>

  <script>
    let merchants = [];
    let activeCategory = 'All';
    let activeCity = 'All';

    async function init() {
      try {
        const res = await fetch('./data.json');
        if (res.ok) {
          merchants = await res.json();
        }
      } catch (err) {
        console.error('Failed to load data.json', err);
      }
      populateFilters();
      render();
    }

    function populateFilters() {
      const categories = ['All', ...new Set(merchants.map(m => m.category || m.Category || m.Type).filter(Boolean))].sort();
      const catContainer = document.getElementById('category-pills');
      catContainer.innerHTML = categories.map(cat => `
        <button
          onclick="selectCategory('${cat}')"
          class="px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-colors ${
            activeCategory === cat
              ? 'bg-blue-600 text-white shadow-sm'
              : 'bg-slate-900 text-slate-300 hover:bg-slate-800 border border-slate-800'
          }"
        >
          ${cat}
        </button>
      `).join('');

      const cities = ['All', ...new Set(merchants.map(m => m.city || m['City / Town'] || m.City).filter(Boolean))].sort();
      const citySelect = document.getElementById('city-select');
      citySelect.innerHTML = cities.map(c => `<option value="${c}" ${activeCity === c ? 'selected' : ''}>${c}</option>`).join('');
    }

    function selectCategory(cat) {
      activeCategory = cat;
      populateFilters();
      render();
    }

    document.getElementById('city-select').addEventListener('change', (e) => {
      activeCity = e.target.value;
      render();
    });

    document.getElementById('search-input').addEventListener('input', render);

    function render() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      const filtered = merchants.filter(m => {
        const cat = m.category || m.Category || m.Type || '';
        const city = m.city || m['City / Town'] || m.City || '';
        const matchesCategory = activeCategory === 'All' || cat === activeCategory;
        const matchesCity = activeCity === 'All' || city === activeCity;
        const matchesQuery = !query || Object.values(m).some(v => String(v).toLowerCase().includes(query));
        return matchesCategory && matchesCity && matchesQuery;
      });

      document.getElementById('total-count').textContent = filtered.length.toLocaleString();
      const grid = document.getElementById('card-grid');
      const empty = document.getElementById('empty-state');

      if (filtered.length === 0) {
        grid.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }

      empty.classList.add('hidden');
      const slice = filtered.slice(0, 120);
      grid.innerHTML = slice.map(item => {
        const title = item.title || item.Name || 'Merchant';
        const cat = item.category || item.Type || 'Retail';
        const subType = item.subType || item['Sub-type (original)'] || '';
        const city = item.city || item['City / Town'] || '';
        const address = item.address || item.Address || '';
        const lat = item.lat || item.Latitude;
        const lng = item.lng || item.Longitude;
        const mapsUrl = lat && lng ? `https://www.google.com/maps/search/?api=1&query=${lat},${lng}` : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(title + ' ' + address)}`;

        return `
          <div class="bg-slate-900 border border-slate-800/90 hover:border-slate-700 rounded-xl p-5 transition shadow-sm flex flex-col justify-between">
            <div>
              <div class="flex items-center justify-between text-xs mb-3">
                <span class="px-2.5 py-0.5 rounded-full bg-blue-950 text-blue-300 font-medium border border-blue-900/40">${cat}</span>
                ${city ? `<span class="text-slate-400 font-medium">${city}</span>` : ''}
              </div>
              <h3 class="text-base font-bold text-white mb-1 leading-snug">${title}</h3>
              ${subType ? `<p class="text-xs text-blue-400/90 mb-2 font-medium">${subType}</p>` : ''}
              ${address ? `<p class="text-xs text-slate-400 line-clamp-2 mb-3">${address}</p>` : ''}
            </div>
            <div class="pt-3 border-t border-slate-800/80 flex items-center justify-between text-xs">
              <span class="text-emerald-400 font-medium flex items-center gap-1">
                <span class="w-2 h-2 rounded-full bg-emerald-500"></span> Shop Small
              </span>
              <a href="${mapsUrl}" target="_blank" rel="noopener noreferrer" class="text-blue-400 hover:text-blue-300 font-semibold inline-flex items-center gap-1">
                Open Map &rarr;
              </a>
            </div>
          </div>
        `;
      }).join('');
    }

    document.getElementById('file-uploader').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        const text = evt.target.result;
        if (file.name.endsWith('.json')) {
          try {
            merchants = JSON.parse(text);
            populateFilters();
            render();
          } catch (err) {
            alert('Invalid JSON');
          }
        } else if (file.name.endsWith('.csv')) {
          merchants = parseCSV(text);
          populateFilters();
          render();
        }
      };
      reader.readAsText(file);
    });

    function parseCSV(text) {
      const lines = text.trim().split(/\r?\n/);
      if (lines.length < 2) return [];
      const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
      return lines.slice(1).map(line => {
        const values = line.split(',').map(v => v.trim().replace(/^"|"$/g, ''));
        const obj = {};
        headers.forEach((h, idx) => { obj[h] = values[idx] || ''; });
        return obj;
      });
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
